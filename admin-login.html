<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Online Exam
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Student Login</a>
        </nav>

    </header>


    <main>

        <section class="form-section">

            <div class="form-container">

                <h1>Admin Login</h1>

                <p>Login to access the Admin Module</p>

                <form id="adminLoginForm">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >


                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >


                    <button type="submit">
                        Admin Login
                    </button>

                </form>

                <p
                    class="form-message"
                    id="adminLoginMessage">
                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>© 2026 Online Examination System</p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
