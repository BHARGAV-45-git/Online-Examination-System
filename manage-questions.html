<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Questions</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Online Exam - Admin
        </div>

        <nav>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
            <a href="#" onclick="adminLogout()">Logout</a>
        </nav>

    </header>


    <main>

        <section class="manage-section">

            <h1>Manage Questions</h1>

            <p>Add questions to the examination.</p>


            <div class="question-form-container">

                <form id="questionForm">

                    <label for="question">
                        Question
                    </label>

                    <input
                        type="text"
                        id="question"
                        placeholder="Enter question"
                        required
                    >


                    <label for="option1">
                        Option 1
                    </label>

                    <input
                        type="text"
                        id="option1"
                        placeholder="Enter option 1"
                        required
                    >


                    <label for="option2">
                        Option 2
                    </label>

                    <input
                        type="text"
                        id="option2"
                        placeholder="Enter option 2"
                        required
                    >


                    <label for="option3">
                        Option 3
                    </label>

                    <input
                        type="text"
                        id="option3"
                        placeholder="Enter option 3"
                        required
                    >


                    <label for="option4">
                        Option 4
                    </label>

                    <input
                        type="text"
                        id="option4"
                        placeholder="Enter option 4"
                        required
                    >


                    <label for="correctAnswer">
                        Correct Answer
                    </label>

                    <input
                        type="text"
                        id="correctAnswer"
                        placeholder="Enter correct answer"
                        required
                    >


                    <button type="submit">
                        Add Question
                    </button>

                </form>

                <p
                    class="form-message"
                    id="questionMessage">
                </p>

            </div>


            <div class="question-list">

                <h2>Added Questions</h2>

                <div id="questionList">
                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>© 2026 Online Examination System</p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
