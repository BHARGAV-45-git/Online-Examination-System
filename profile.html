<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Online Exam
        </div>

        <nav>
            <a href="user-dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>

    </header>


    <main>

        <section class="profile-section">

            <div class="profile-container">

                <h1>Student Profile</h1>

                <div class="profile-info">

                    <p>
                        <strong>Name:</strong>
                        <span id="profileName">Loading...</span>
                    </p>

                    <p>
                        <strong>Email:</strong>
                        <span id="profileEmail">Loading...</span>
                    </p>

                    <p>
                        <strong>Latest Exam Score:</strong>
                        <span id="profileScore">No exam attempted</span>
                    </p>

                </div>

                <button onclick="window.location.href='user-dashboard.html'">
                    Back to Dashboard
                </button>

            </div>

        </section>

    </main>


    <footer>

        <p>© 2026 Online Examination System</p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
